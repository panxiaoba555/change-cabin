<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>王者指挥官：峡谷卡牌演武平台</title>
    <style>
        /* 全局美化：唯美古风星空背景 */
        body {
            background: linear-gradient(135deg, #0e051d, #1f0b3a, #0b1c3a);
            color: #e0b3ff;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        h1 {
            text-align: center;
            font-size: 2.5rem;
            color: #d1a3ff;
            text-shadow: 0 0 15px #ba7fff, 0 0 30px #ba7fff;
            margin-bottom: 5px;
            animation: breathe 3s infinite ease-in-out;
        }

        p.subtitle {
            text-align: center;
            color: #8da2fb;
            margin-top: 0;
            margin-bottom: 25px;
        }

        /* 游戏核心大容器 */
        .game-container {
            display: grid;
            grid-template-columns: 3fr 1fr;
            gap: 20px;
            width: 100%;
            max-width: 1200px;
        }

        /* 左侧主战场 */
        .battlefield {
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid #5a3c85;
            border-radius: 20px;
            padding: 20px;
            box-shadow: inset 0 0 30px rgba(186, 127, 255, 0.1), 0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
        }

        /* 顶部状态与血条 */
        .status-header {
            display: flex;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.4);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #ba7fff44;
            margin-bottom: 20px;
        }

        .hp-box {
            width: 45%;
        }

        .hp-label {
            font-weight: bold;
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
        }

        .progress-bar {
            background: #222;
            border-radius: 8px;
            height: 16px;
            overflow: hidden;
            border: 1px solid #444;
        }

        .progress-fill {
            height: 100%;
            transition: width 0.5s ease;
        }

        .my-hp { background: linear-gradient(90deg, #a855f7, #ec4899); box-shadow: 0 0 10px #ec4899; }
        .enemy-hp { background: linear-gradient(90deg, #ef4444, #f97316); box-shadow: 0 0 10px #ef4444; }

        /* 峡谷两军对垒卡牌区 */
        .team-container {
            margin: 20px 0;
        }

        .team-title {
            font-size: 1.2rem;
            margin-bottom: 10px;
            padding-left: 10px;
            border-left: 4px solid #ba7fff;
        }

        .cards-row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
        }

        /* 优美的动态卡牌样式 */
        .hero-card {
            background: linear-gradient(145deg, #24123a, #150924);
            border: 1px solid #ba7fff55;
            border-radius: 12px;
            padding: 12px;
            width: 16%;
            min-width: 100px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            position: relative;
        }

        .hero-card:hover {
            transform: translateY(-8px) scale(1.03);
            border-color: #ba7fff;
            box-shadow: 0 12px 25px rgba(186, 127, 255, 0.3);
        }

        .my-team .hero-card { border-color: #a855f766; }
        .enemy-team .hero-card { border-color: #ef444466; }

        .hero-avatar {
            font-size: 2.2rem;
            margin-bottom: 8px;
        }

        .hero-name {
            font-weight: bold;
            font-size: 1rem;
            color: #fff;
        }

        .hero-role {
            font-size: 0.75rem;
            color: #8da2fb;
        }

        /* 战术控制面板 */
        .controls-panel {
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            padding: 15px;
            margin-top: 25px;
            border: 1px solid #ba7fff22;
        }

        .actions-row {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .btn {
            background: linear-gradient(135deg, #7c3aed, #4c1d95);
            color: #fff;
            border: 1px solid #a78bfa;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 10px rgba(124, 58, 237, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(124, 58, 237, 0.5);
            filter: brightness(1.1);
        }

        .btn-push { background: linear-gradient(135deg, #059669, #064e3b); border-color: #34d399; box-shadow: 0 4px 10px rgba(52, 211, 153, 0.3);}
        .btn-ult { background: linear-gradient(135deg, #db2777, #831843); border-color: #f472b6; box-shadow: 0 4px 10px rgba(244, 114, 182, 0.3);}

        /* 动态战局日志 */
        .log-box {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            height: 120px;
            overflow-y: auto;
            margin-top: 15px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            color: #a7f3d0;
            text-align: left;
        }

        /* 右侧商店与经济面板 */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .info-panel, .shop-panel {
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid #5a3c85;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }

        .gold-display {
            font-size: 1.8rem;
            font-weight: bold;
            color: #f59e0b;
            text-shadow: 0 0 10px rgba(245, 158, 11, 0.4);
            text-align: center;
            margin: 10px 0;
        }

        .shop-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #444;
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
        }

        .shop-item:hover {
            background: rgba(186, 127, 255, 0.1);
            border-color: #ba7fff;
        }

        .item-details {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .item-name { font-weight: bold; color: #fff; font-size: 0.95rem; }
        .item-desc { font-size: 0.75rem; color: #aaa; margin-top: 2px; }
        .item-cost { color: #f59e0b; font-weight: bold; font-size: 0.85rem; margin-top: 2px; }

        .btn-buy {
            background: #f59e0b;
            color: #000;
            border: none;
            padding: 6px 12px;
            font-size: 0.8rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-buy:hover { filter: brightness(1.2); }

        /* 动画效果定义 */
        @keyframes breathe {
            0%, 100% { transform: scale(1); text-shadow: 0 0 15px #ba7fff; }
            50% { transform: scale(1.02); text-shadow: 0 0 25px #ba7fff, 0 0 40px #d1a3ff; }
        }

        .flash-damage {
            animation: flashRed 0.3s ease;
        }

        @keyframes flashRed {
            0%, 100% { background: rgba(255, 255, 255, 0.03); }
            50% { background: rgba(239, 68, 68, 0.2); border-color: #ef4444; }
        }
    </style>
</head>
